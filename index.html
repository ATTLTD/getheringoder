<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>115/11/5(四)中午聚餐 虎尾 人間知味</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#1E2A21; --muted:#5C6B60;
  --paddy:#2F5E3E; --paddy-soft:#DCE8DF; --sesame:#B7792A; --sesame-soft:#F6E9D4;
  --rule:#D3DBD2; --danger:#A23B2A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A16; --surface:#1C241F; --ink:#E7EDE8; --muted:#9DAAA0;
    --paddy:#8CC29C; --paddy-soft:#24382B; --sesame:#E0A75A; --sesame-soft:#3A2E1C;
    --rule:#2E3A32; --danger:#E08A78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1C241F; --ink:#E7EDE8; --muted:#9DAAA0;
  --paddy:#8CC29C; --paddy-soft:#24382B; --sesame:#E0A75A; --sesame-soft:#3A2E1C;
  --rule:#2E3A32; --danger:#E08A78; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sesame);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* 頁首 */
header.top{padding:28px 0 8px}
.brandrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,5vw,38px);line-height:1.15;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.viewswitch{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface)}
.viewswitch a{padding:6px 16px;text-decoration:none;color:var(--muted);font-size:14px}
.viewswitch a[aria-current="page"]{background:var(--paddy);color:var(--surface)}

/* 分類列 */
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);margin-top:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
nav.cats ul{list-style:none;margin:0;padding:10px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.cats a{display:block;white-space:nowrap;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px;border:1px solid transparent}
nav.cats a.on{border-color:var(--paddy);color:var(--paddy);font-weight:700}

.layout{display:grid;grid-template-columns:1fr;gap:28px;padding:20px 0 140px}
@media (min-width:900px){.layout{grid-template-columns:1fr 340px;padding-bottom:48px}}

section.cat{margin-bottom:36px}
section.cat h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section.cat h2 small{font-family:var(--sans);font-weight:400;font-size:14px;color:var(--muted)}
.catnote{margin:0 0 12px;padding:10px 14px;background:var(--sesame-soft);border-left:4px solid var(--sesame);font-size:14.5px}

/* 套餐：以大號字母為視覺重心 */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.set{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.set .letter{font-family:var(--serif);font-weight:900;font-size:56px;line-height:.9;color:var(--paddy)}
.set .nm{font-weight:700;font-size:17px}
.set .incl{font-size:14px;color:var(--muted);margin:0}
.set .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--rule)}

/* 一般品項 */
ul.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
ul.items li{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--rule);align-items:center}
ul.items li:last-child{border-bottom:0}
.iname{font-weight:500}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.tag.veg{color:var(--paddy)}
.tag.ltd{color:var(--sesame)}
.price{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.price.ask{font-size:13px}
.opts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 14px}
.optgroup{display:flex;gap:4px;align-items:center}
.chip{border:1px solid var(--rule);background:transparent;border-radius:3px;padding:2px 10px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--paddy-soft);border-color:var(--paddy);color:var(--paddy);font-weight:700}

.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper button.add{background:var(--paddy);border-color:var(--paddy);color:var(--surface)}
.stepper .q{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.stepper button:disabled{opacity:.35;cursor:default}

/* 購物車 */
aside.cart{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px;align-self:start}
@media (min-width:900px){aside.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}}
aside.cart h2{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.empty{color:var(--muted);font-size:14.5px;margin:8px 0}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:14.5px}
.lines .lopt{grid-column:1;color:var(--muted);font-size:13px}
.lines .lsum{text-align:right;font-variant-numeric:tabular-nums}
.lines .stepper{grid-column:2;justify-self:end}
.lines .stepper button{width:28px;height:28px;font-size:15px}
.totals{margin:12px 0;font-size:15px}
.totals div{display:flex;justify-content:space-between}
.totals .disc{color:var(--paddy)}
.totals .grand{font-family:var(--serif);font-weight:900;font-size:24px;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:4px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:14px}
.field input,.field textarea{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px}
.btn{width:100%;padding:12px;border:0;border-radius:4px;background:var(--paddy);color:var(--surface);font-weight:700;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.err{color:var(--danger);font-size:14px}

/* 手機底部列 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paddy);color:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;border:0;width:100%;font-size:16px}
.bar b{font-family:var(--serif);font-size:20px}
@media (min-width:900px){.bar{display:none}}
@media (max-width:899px){
  aside.cart{display:none}
  aside.cart.open{display:block;position:fixed;inset:auto 0 0 0;z-index:40;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}

/* 送出完成 */
.done{text-align:center;padding:12px 0}
.done .no{font-family:var(--serif);font-weight:900;font-size:48px;color:var(--paddy);letter-spacing:.06em}

/* 後台 */
.kbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:48px}
.ticket{background:var(--surface);border:1px solid var(--rule);border-top:6px solid var(--sesame);border-radius:4px;padding:14px}
.ticket[data-s="cooking"]{border-top-color:var(--paddy)}
.ticket[data-s="done"],.ticket[data-s="cancel"]{opacity:.6;border-top-color:var(--rule)}
.ticket .th{display:flex;justify-content:space-between;align-items:baseline}
.ticket .tno{font-family:var(--serif);font-weight:900;font-size:26px}
.ticket .meta{color:var(--muted);font-size:13.5px}
.ticket ul{margin:8px 0;padding-left:18px;font-size:15px}
.ticket .tnote{background:var(--sesame-soft);padding:6px 10px;font-size:14px;margin:6px 0}
.ticket .acts{display:flex;gap:6px;margin-top:10px}
.ticket .acts button{flex:1;padding:8px;border-radius:3px;border:1px solid var(--rule);background:var(--surface);font-size:14px}
.ticket .acts button.pri{background:var(--paddy);border-color:var(--paddy);color:var(--surface)}
.sumtbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);font-size:15px;margin-bottom:24px}
.sumtbl th,.sumtbl td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.sumtbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtbl tfoot td{font-weight:700}
.kh{font-family:var(--serif);font-size:20px;margin:8px 0 10px}
.tblwrap{overflow-x:auto}
.notice{padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.stepper button.add:active{transform:scale(.92)}}
</style>
</head>

MENU.forEach(c=>c.items.forEach(it=>sel[it.id]=defaultOpts(it)));
function lineKey(id,o){return id+"|"+JSON.stringify(o)}
function unitPrice(l){const it=ITEM[l.id]; if(it.price==null) return null; return it.price+(l.opts._pearl?PEARL.price:0)}
function optText(o){const p=Object.entries(o).filter(([k])=>k!=="_pearl").map(([,v])=>v); if(o._pearl) p.push("加"+PEARL.name); return p.join("、")}
function qtyOf(id){let n=0; cart.forEach(l=>{if(l.id===id) n+=l.qty}); return n}
function calc(){
  let sub=0,count=0,sets=0,drinks=0,unpriced=false;
  cart.forEach(l=>{const it=ITEM[l.id],p=unitPrice(l); count+=l.qty; if(p==null) unpriced=true; else sub+=p*l.qty; if(it.set) sets+=l.qty; if(it.drink&&it.price!=null) drinks+=l.qty});
  const discount=Math.min(sets,drinks)*SET_DRINK_DISCOUNT;
  return {sub,count,sets,drinks,discount,total:sub-discount,unpriced};
}

/* ===== 與 Google 試算表連線 ===== */
async function api(params, body){
  if(!CONFIG.API_URL) throw new Error("尚未設定 API_URL");
  const res = body
    ? await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    : await fetch(CONFIG.API_URL+"?"+new URLSearchParams(params));
  const j = await res.json();
  if(!j.ok && !j.exists) throw new Error(j.error||"伺服器回應錯誤");
  return j;
}

/* ===== 菜單 ===== */
function priceHTML(it){return it.price==null?'<span class="price ask">價格請洽櫃檯</span>':`<span class="price">${money(it.price)}</span>`}
function stepperHTML(id){const q=qtyOf(id); return `<div class="stepper"><button type="button" data-dec="${id}" aria-label="減少 ${esc(ITEM[id].name)}" ${q?"":"disabled"}>−</button><span class="q" aria-live="polite">${q||""}</span><button type="button" class="add" data-add="${id}" aria-label="加入 ${esc(ITEM[id].name)}">+</button></div>`}
function optsHTML(it){
  if(!it.opts&&!it.tea) return "";
  let h='<div class="opts">';
  (it.opts||[]).forEach(g=>{
    if(g.vals.length<2){h+=`<span class="optgroup"><span class="chip" aria-pressed="true">${esc(g.vals[0])}</span></span>`;return}
    h+=`<span class="optgroup" role="group" aria-label="${esc(g.key)}">`+g.vals.map(v=>`<button type="button" class="chip" data-opt="${it.id}" data-k="${esc(g.key)}" data-v="${esc(v)}" aria-pressed="${sel[it.id][g.key]===v}">${esc(v)}</button>`).join("")+"</span>";
  });
  if(it.tea) h+=`<button type="button" class="chip" data-pearl="${it.id}" aria-pressed="${sel[it.id]._pearl}">加${PEARL.name} +${PEARL.price}</button>`;
  return h+"</div>";
}
function tags(it){return (it.veg?'<span class="tag veg">素</span>':"")+(it.ltd?'<span class="tag ltd">季節限定</span>':"")+(it.tea?'<span class="tag ltd">茶飲</span>':"")}
function renderMenu(){
  $("#catnav").innerHTML=MENU.map(c=>`<li><a href="#cat-${c.id}" data-cat="${c.id}">${esc(c.name)}</a></li>`).join("");
  $("#menu").innerHTML=MENU.map(c=>{
    const body=c.id==="set"
      ? '<div class="sets">'+c.items.map(it=>`<article class="set"><div class="letter" aria-hidden="true">${it.id}</div><div class="nm">${esc(it.name)}</div><p class="incl">${esc(it.incl)}</p><div class="foot">${priceHTML(it)}<span data-step="${it.id}">${stepperHTML(it.id)}</span></div></article>`).join("")+"</div>"
      : '<ul class="items">'+c.items.map(it=>`<li><div><span class="iname">${esc(it.name)}</span>${tags(it)}<br>${priceHTML(it)}</div><span data-step="${it.id}">${stepperHTML(it.id)}</span>${optsHTML(it)}</li>`).join("")+"</ul>";
    return `<section class="cat" id="cat-${c.id}"><h2>${esc(c.name)}${c.sub?`<small>${esc(c.sub)}</small>`:""}</h2>${c.note?`<p class="catnote">${esc(c.note)}</p>`:""}${c.id==="drink"?`<p class="catnote">標示「茶飲」的品項可加${PEARL.name}（+$${PEARL.price}）。</p>`:""}${body}</section>`;
  }).join("");
}
function refreshSteppers(){document.querySelectorAll("[data-step]").forEach(el=>el.innerHTML=stepperHTML(el.dataset.step))}

/* ===== 購物車 ===== */
function addItem(id){
  if(doneInfo) doneInfo=null;
  const o={...sel[id]}; if(!ITEM[id].tea) delete o._pearl;
  const k=lineKey(id,o), l=cart.get(k); if(l) l.qty++; else cart.set(k,{id,opts:o,qty:1}); update();
}
function decItem(id){
  const o={...sel[id]}; if(!ITEM[id].tea) delete o._pearl;
  let k=lineKey(id,o);
  if(!cart.has(k)){const ks=[...cart.keys()].filter(x=>cart.get(x).id===id); k=ks[ks.length-1]}
  if(k) changeLine(k,-1);
}
function changeLine(k,d){const l=cart.get(k); if(!l) return; if(doneInfo) doneInfo=null; l.qty+=d; if(l.qty<=0) cart.delete(k); update()}

function renderCart(){
  const c=calc(), el=$("#cart");
  if(doneInfo){
    el.innerHTML=`<div class="done"><p class="hint">${doneInfo.updated?"已更新，謝謝！":"已送出，謝謝！"}</p><div class="no">${esc(doneInfo.name)}</div>
      <p class="totals"><span class="grand">${money(doneInfo.total)}</span>${doneInfo.unpriced?'<br><span class="hint">另有洽櫃檯計價品項</span>':""}</p>
      <p class="hint">之後用同一支手機打開這個網頁，會自動帶出你的點餐；換手機時輸入姓名後按「載入」即可修改。</p>
      <button class="btn" type="button" id="editmine">修改我的點餐</button>
      <p></p><button class="btn ghost" type="button" id="neworder">幫其他人點餐</button></div>`;
    return;
  }
  const isUpdate = loaded && formName.trim()===loaded;
  let h=`<h2>${isUpdate?"修改我的點餐":"你的餐點"}</h2>`;
  if(closed()) h+='<p class="err">點餐已截止，目前無法送出或修改。</p>';
  if(!c.count) h+='<p class="empty">從菜單按「+」加入餐點。</p>';
  else{
    h+='<ul class="lines">';
    cart.forEach((l,k)=>{
      const it=ITEM[l.id],p=unitPrice(l),ot=optText(l.opts);
      h+=`<li><span>${it.set?it.id+" ":""}${esc(it.name)}</span><span class="lsum">${p==null?"洽櫃檯":money(p*l.qty)}</span>${ot?`<span class="lopt">${esc(ot)}</span>`:"<span></span>"}<div class="stepper"><button type="button" data-ldec="${esc(k)}" aria-label="減少">−</button><span class="q">${l.qty}</span><button type="button" class="add" data-linc="${esc(k)}" aria-label="增加">+</button></div></li>`;
    });
    h+='</ul><div class="totals">'+`<div><span>小計</span><span>${money(c.sub)}</span></div>`;
    if(c.discount) h+=`<div class="disc"><span>套餐加購飲品折抵（${c.discount/SET_DRINK_DISCOUNT} 杯）</span><span>−${money(c.discount)}</span></div>`;
    h+=`<div class="grand"><span>合計</span><span>${money(c.total)}</span></div></div>`;
    if(c.sets>c.drinks) h+=`<p class="hint">再加購 ${c.sets-c.drinks} 杯飲品，每杯可折抵 $${SET_DRINK_DISCOUNT}。</p>`;
    if(c.unpriced) h+='<p class="hint">部分品項價格請洽櫃檯，未計入合計。</p>';
  }
  h+=`<div class="field"><label for="who">點餐人 <span class="err">*</span></label><div class="seg"><input id="who" style="flex:1" maxlength="20" autocomplete="off" placeholder="請輸入姓名" value="${esc(formName)}"><button type="button" class="chip" id="loadbtn">載入</button></div></div>`;
  if(msg) h+=`<p class="hint" aria-live="polite">${esc(msg)}</p>`;
  h+=`<label class="field"><span>備註（選填）</span><textarea id="note" rows="2" maxlength="200" placeholder="例如：不要香菜、飯少一點">${esc(formNote)}</textarea></label>`;
  h+=`<p class="err" id="err" hidden></p><button class="btn" type="button" id="submit" ${busy||closed()?"disabled":""}>${busy?"處理中…":isUpdate?"更新點餐":"送出點餐"}</button>`;
  if(isUpdate) h+=`<p></p><button class="btn ghost" type="button" id="cancelmine" ${busy||closed()?"disabled":""}>取消我的點餐</button>`;
  el.innerHTML=h;
}
function renderBar(){
  const c=calc();
  $("#barcount").textContent=doneInfo?`已送出（${doneInfo.name}）`:(c.count?`查看點餐（${c.count} 項）`:(loaded?`修改 ${loaded} 的點餐`:"尚未點餐"));
  $("#bartotal").textContent=money(doneInfo?doneInfo.total:c.total);
}
function update(){refreshSteppers(); renderCart(); renderBar()}
function showErr(t){const e=$("#err"); if(e){e.textContent=t; e.hidden=false}}

/* ===== 載入／送出／取消 ===== */
async function loadByName(name, silent){
  name=name.trim(); if(!name){showErr("請先輸入姓名。"); return}
  busy=true; update();
  try{
    const j=await api({action:"get",name});
    if(j.order){
      cart.clear();
      (j.order.cart||[]).forEach(l=>{if(ITEM[l.id]&&l.qty>0) cart.set(lineKey(l.id,l.opts||{}),{id:l.id,opts:l.opts||{},qty:Number(l.qty)})});
      formName=name; formNote=j.order.note||""; loaded=name; lsSet(name);
      msg=`已載入「${name}」的點餐，修改後按「更新點餐」。`;
    }else{
      if(!silent) msg=`找不到「${name}」的點餐，可以直接開始點。`;
      if(lsGet()===name) lsSet("");
      loaded=null;
    }
  }catch(e){ msg=silent?"":"讀取失敗，請確認網路連線後再按一次「載入」。" }
  busy=false; doneInfo=null; update();
}

async function submitOrder(overwrite){
  const name=formName.trim(), c=calc();
  if(closed()){showErr("點餐已截止。");return}
  if(!name){showErr("請填寫點餐人後再送出。"); $("#who").focus(); return}
  if(!c.count){showErr(loaded===name?"請至少選一項餐點；不參加的話請按「取消我的點餐」。":"請至少選一項餐點。");return}
  const wasUpdate = loaded===name;
  const body={action:"save",name,overwrite:overwrite||wasUpdate,
    cart:[...cart.values()].map(l=>({id:l.id,opts:l.opts,qty:l.qty})),
    items:[...cart.values()].map(l=>({name:(ITEM[l.id].set?ITEM[l.id].id+" ":"")+ITEM[l.id].name,opts:optText(l.opts),qty:l.qty,price:unitPrice(l)})),
    subtotal:c.sub,discount:c.discount,total:c.total,unpriced:c.unpriced,note:formNote.trim()};
  busy=true; update();
  try{
    const j=await api(null,body);
    busy=false;
    if(j.exists){
      update();
      if(confirm(`「${name}」已經有點餐紀錄。要用這次的內容取代嗎？\n（如果是同名的另一位朋友，請按取消，並在姓名後加上辨識字，例如「小明-阿姨」）`)) return submitOrder(true);
      return;
    }
    loaded=name; lsSet(name); msg="";
    doneInfo={name,total:c.total,unpriced:c.unpriced,updated:wasUpdate||overwrite};
    update(); toggleSheet(true);
  }catch(e){ busy=false; update(); showErr("沒有送出成功，請確認網路連線後再按一次。") }
}

async function cancelMine(){
  const name=formName.trim();
  if(!confirm(`確定要取消「${name}」的點餐嗎？`)) return;
  busy=true; update();
  try{
    await api(null,{action:"delete",name});
    cart.clear(); loaded=null; formNote=""; lsSet(""); msg=`已取消「${name}」的點餐。`;
  }catch(e){ msg="取消失敗，請確認網路連線後再試一次。" }
  busy=false; update();
}

/* ===== 點餐總覽 ===== */
let kFilter="person", orders=[], loadedAt=null, kLoading=false, kError="";
async function fetchSummary(){
  kLoading=true; kError=""; renderSummary();
  try{ const j=await api({action:"list"}); orders=j.orders||[]; loadedAt=new Date() }
  catch(e){ kError="讀取失敗，請確認網路連線後按「重新整理」。" }
  kLoading=false; renderSummary();
}
function renderSummary(){
  $("#kfilter").innerHTML=[["person","依點餐人"],["item","依品項彙總"]].map(([k,v])=>`<button type="button" class="chip" data-kf="${k}" aria-pressed="${kFilter===k}">${v}</button>`).join("")
    +`<button type="button" class="chip" id="krefresh">${kLoading?"讀取中…":"重新整理"}</button>`
    +(loadedAt?`<span class="hint">更新於 ${loadedAt.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</span>`:"");
  if(!CONFIG.API_URL){$("#kbody").innerHTML='<p class="notice">尚未設定試算表連線（API_URL）。</p>';return}
  if(kError){$("#kbody").innerHTML=`<p class="notice">${esc(kError)}</p>`;return}
  if(!orders.length){$("#kbody").innerHTML=kLoading?"":'<p class="notice">還沒有人送出點餐。</p>';return}
  const total=orders.reduce((a,o)=>a+(o.total||0),0), disc=orders.reduce((a,o)=>a+(o.discount||0),0), unp=orders.some(o=>o.unpriced);
  let h=`<p class="hint">共 ${orders.length} 人，合計 ${money(total)}${disc?`（已含套餐飲品折抵 ${money(disc)}）`:""}${unp?"，另有洽櫃檯計價品項":""}。</p>`;
  if(kFilter==="item"){
    const agg=new Map();
    orders.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name+"|"+(i.opts||""); const g=agg.get(k)||{name:i.name,opts:i.opts||"",qty:0,who:[]}; g.qty+=Number(i.qty)||0; g.who.push(o.name+(i.qty>1?`×${i.qty}`:"")); agg.set(k,g)}));
    h+='<div class="tblwrap"><table class="sumtbl"><thead><tr><th>品項</th><th>數量</th><th>點餐人</th></tr></thead><tbody>'+[...agg.values()].map(g=>`<tr><td>${esc(g.name)}${g.opts?`<br><span class="meta">${esc(g.opts)}</span>`:""}</td><td class="n">${g.qty}</td><td>${esc(g.who.join("、"))}</td></tr>`).join("")+`</tbody><tfoot><tr><td>總金額</td><td class="n" colspan="2">${money(total)}</td></tr></tfoot></table></div>`;
  }else{
    h+='<div class="kgrid">'+orders.map(o=>{
      const tm=o.updated?new Date(o.updated).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
      return `<article class="ticket"><div class="th"><span class="tno">${esc(o.name)}</span><span class="meta">${tm}</span></div>
      <div class="meta">${money(o.total)}${o.discount?`（已折 ${money(o.discount)}）`:""}${o.unpriced?"・含洽櫃檯品項":""}</div>
      <ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} × ${Number(i.qty)}${i.opts?`<br><span class="meta">${esc(i.opts)}</span>`:""}</li>`).join("")}</ul>
      ${o.note?`<div class="tnote">${esc(o.note)}</div>`:""}</article>`;
    }).join("")+"</div>";
  }
  $("#kbody").innerHTML=h;
}

/* ===== 路由 ===== */
function route(){return location.hash==="#summary"?"summary":"order"}
function applyRoute(){
  const r=route();
  $("#view-order").hidden=r!=="order"; $("#view-kitchen").hidden=r!=="summary";
  $("#lnk-order").setAttribute("aria-current",r==="order"?"page":"false");
  $("#lnk-kitchen").setAttribute("aria-current",r==="summary"?"page":"false");
  $("#subline").textContent=r==="order"?"填上點餐人、選好餐點後送出，送出後隨時可以回來修改。":"大家的點餐會彙整在這裡，可依點餐人或品項查看。";
  if(r==="summary") fetchSummary();
}
window.addEventListener("hashchange",()=>{if(["#order","#summary",""].includes(location.hash)) applyRoute()});

/* ===== 事件 ===== */
document.addEventListener("input",e=>{
  if(e.target.id==="who"){formName=e.target.value; const was=$("#submit")?.textContent; const isUpd=loaded&&formName.trim()===loaded; if($("#submit")&&!busy) $("#submit").textContent=isUpd?"更新點餐":"送出點餐"}
  if(e.target.id==="note") formNote=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") toggleSheet(false);
  if(e.key==="Enter"&&e.target.id==="who"){e.preventDefault(); loadByName(formName)}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); if(!t) return; const ds=t.dataset;
  if(ds.add) addItem(ds.add);
  else if(ds.dec) decItem(ds.dec);
  else if(ds.opt){sel[ds.opt][ds.k]=ds.v; t.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  else if(ds.pearl){sel[ds.pearl]._pearl=!sel[ds.pearl]._pearl; t.setAttribute("aria-pressed",sel[ds.pearl]._pearl)}
  else if(ds.linc) changeLine(ds.linc,1);
  else if(ds.ldec) changeLine(ds.ldec,-1);
  else if(t.id==="submit") submitOrder(false);
  else if(t.id==="loadbtn") loadByName(formName);
  else if(t.id==="cancelmine") cancelMine();
  else if(t.id==="editmine"){doneInfo=null; msg=""; update()}
  else if(t.id==="neworder"){doneInfo=null; cart.clear(); formName=""; formNote=""; loaded=null; msg=""; update()}
  else if(t.id==="bar") toggleSheet(true);
  else if(t.id==="krefresh") fetchSummary();
  else if(ds.cat){e.preventDefault(); document.getElementById("cat-"+ds.cat).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
  else if(ds.kf){kFilter=ds.kf; renderSummary()}
});
$("#scrim").addEventListener("click",()=>toggleSheet(false));
function toggleSheet(open){if(!matchMedia("(max-width:899px)").matches) return; $("#cart").classList.toggle("open",open); $("#scrim").hidden=!open}
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting) document.querySelectorAll("#catnav a").forEach(a=>a.classList.toggle("on",a.dataset.cat===en.target.id.slice(4)))}),{rootMargin:"-30% 0px -60% 0px"});

/* ===== 啟動 ===== */
renderMenu(); update(); applyRoute();
document.querySelectorAll("section.cat").forEach(s=>io.observe(s));
if(!CONFIG.API_URL) $("#setup").hidden=false;
else { const n=lsGet(); if(n){formName=n; loadByName(n,true)} }

</script>
</body>
